      <h1>花间词派与《花间集》</h1>
      <p class="m-sub">五代 · 词集 · 940 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">五代</span><span class="tag">词</span><span class="tag">花间集</span><span class="tag">温庭筠</span><span class="tag">韦庄</span></div>
      
      <div class="m-detail">花间词以“镂玉雕琼”的艳情小令为主，确立了词婉约的审美基调，也把词从民间曲子词推向文人案头。宋词的语言、题材与体式多由此出，故论词者每以花间为宗。</div>
