      <h1>杯酒释兵权</h1>
      <p class="m-sub">北宋 · 事件 · 961 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">北宋</span><span class="tag">事件</span><span class="tag">兵权</span><span class="tag">集权</span></div>
      
      <div class="m-detail">赵匡胤恐禁军将领效仿陈桥兵变，遂在一次酒宴中劝石守信、高怀德、王审琦等交出兵权，出为节度使，赐以田宅、联姻。此后又设枢密院、三衙分掌调兵与统兵，实行更戍法，使兵不识将、将不知兵。此举奠定了北宋中央集权与重文抑武的格局。</div>
