      <div class="m-detail">《梦粱录》《武林旧事》详记临安岁时：元旦拜年、元宵观灯、清明祭扫、端午竞渡、七夕乞巧、中秋赏月、重阳登高、冬至贺节、除夕守岁。每逢节令，西湖游船、瓦舍勾栏、酒楼茶肆人潮涌动，反映了南宋都城的商业繁荣与市民生活。</div>
