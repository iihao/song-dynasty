      <h1>荫补制度</h1>
      <p class="m-sub">两宋 · 官制</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">官制</span><span class="tag">冗官</span><span class="tag">恩荫</span><span class="tag">入仕</span></div>
      
      <div class="m-detail">荫补名目有郊祀、致仕、遗表、登极等，按官员品级与身份补授子弟、期亲甚至门客，初授多为低阶武官、监当或祠庙官。荫补人数庞大，造成“冗官”与入仕者素质参差；仁宗以后屡加限制，规定考试、年甲与限额，但难以根本裁抑。</div>
