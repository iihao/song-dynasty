    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag grp">名臣</span><span class="tag">北宋</span><span class="tag">地理</span><span class="tag">总志</span><span class="tag">太平寰宇记</span></div>
      
      <div class="m-detail">乐史字子正，抚州宜黄人，南唐时曾任秘书郎，入宋后太平兴国五年举进士。他历官知州、三馆编修，博采图经、地志与史传，成《太平寰宇记》二百卷，记北宋初年全国州县沿革、山川、户口、风俗、人物、艺文，体例完备，是研究唐宋地理与社会的重要文献。</div>
