      <h1>象数学（邵雍）</h1>
      <p class="m-sub">北宋 · 学派</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">北宋</span><span class="tag">易学</span><span class="tag">象数</span><span class="tag">邵雍</span></div>
      
      <div class="m-detail">邵雍居洛阳，著《皇极经世》，以象数推演天地生成、历史兴衰，把时间分为元、会、运、世，提出“皇帝王霸”的历史阶段说。其学融合易学、道家与儒家，神秘而系统，二程称其“内圣外王之学”，对宋明易学与术数影响深远。</div>
