      <h1>立春与鞭春牛</h1>
      <p class="m-sub">两宋 · 节令</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">农耕</span><span class="tag">两宋</span><span class="tag">节令</span><span class="tag">立春</span></div>
      
      <div class="m-detail">立春前，地方官府用泥土塑春牛、芒神，立春当日以彩杖鞭打春牛，称为“鞭春”或“打春”，随后分送春牛土、春幡、春胜，寓意五谷丰登。汴京、临安还有卖春盘、春饼、生菜等习俗。鞭春牛由官方典礼演变为全民节庆，体现重农传统。</div>
