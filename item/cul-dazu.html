      <p class="eyebrow">文化 · 雕塑</p>
      <h1>大足石刻</h1>
      <p class="m-sub">两宋 · 雕塑</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">佛教</span><span class="tag">两宋</span><span class="tag">石刻</span><span class="tag">雕塑</span></div>
      
      <div class="m-detail">大足石刻始凿于唐末，盛于两宋，以宝顶山、北山、石篆山等最为集中。宋代造像突破宗教仪轨，出现《父母恩重经变》《牧牛图》《地狱变相》等贴近世俗生活的题材，雕刻细腻、情节连贯。它反映了宋代佛教向民间、向伦理教化的转向。</div>
