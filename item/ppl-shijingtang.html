      <h1>石敬瑭</h1>
      <p class="m-sub">五代 · 帝王 · 生卒 892—942</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">五代</span><span class="tag grp">帝王</span><span class="tag">后晋</span><span class="tag">燕云十六州</span><span class="tag">儿皇帝</span></div>
      
      <div class="m-detail">石敬瑭为后唐明宗之婿，镇守太原。936 年反唐，求援耶律德光，割十六州并岁输绢帛，对辽称“儿皇帝”。中原自此失去北方屏障，影响延及北宋。</div>
