      <h1>《如梦令·昨夜雨疏风骤》</h1>
      <p class="m-sub">北宋 · 词 · 1100 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">李清照</span><span class="tag">惜春</span><span class="tag">绿肥红瘦</span></div>
      <div class="m-text"><h3>正文</h3><div class="m-text-body">昨夜雨疏风骤，浓睡不消残酒。试问卷帘人，却道海棠依旧。知否，知否，应是绿肥红瘦。</div></div>
      <div class="m-detail">名句：“知否，知否？应是绿肥红瘦。”以“绿肥红瘦”写海棠凋零，造语新奇。</div>
