      <p class="eyebrow">经济 · 新法</p>
      <h1>市易法</h1>
      <p class="m-sub">北宋 · 新法 · 1072 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">商业</span><span class="tag">市场</span><span class="tag">北宋</span><span class="tag">新法</span></div>
      
      <div class="m-detail">熙宁五年在开封设市易务，后推广至诸路，官府参与市场买卖，商人可以货物抵押贷款，年息二分。市易法本意是打击富商垄断、稳定物价，但官营机构效率低下，容易出现强买强卖与赊贷亏空，成为反对派批评新法的重要口实。</div>
