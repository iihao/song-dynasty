      <div class="m-detail">北宋崇文院、秘阁藏书丰富，编《崇文总目》；南宋私家藏书楼林立，晁公武《郡斋读书志》、陈振孙《直斋书录解题》、尤袤《遂初堂书目》等开创解题书目传统。郑樵《通志·校雠略》更从理论上总结分类、编目与亡书求书之法，标志目录学成为独立学问。</div>
