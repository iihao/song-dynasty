      <h1>李焘</h1>
      <p class="m-sub">南宋 · 文豪 · 生卒 1115—1184</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag grp">文豪</span><span class="tag">南宋</span><span class="tag">史学家</span><span class="tag">编年</span><span class="tag">北宋史</span></div>
      
      <div class="m-detail">李焘字仁甫，眉州丹棱人，绍兴八年进士。他仿司马光《资治通鉴》体例，采摭北宋九朝史事，成《续资治通鉴长编》九百八十卷，史料宏富、考订严谨。该书是研究北宋历史最基本的文献之一，原书今存五百二十卷。</div>
