      <h1>张咏</h1>
      <p class="m-sub">北宋 · 名臣 · 生卒 946—1015</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag grp">名臣</span><span class="tag">交子</span><span class="tag">北宋</span><span class="tag">名臣</span><span class="tag">治蜀</span></div>
      
      <div class="m-detail">张咏字复之，濮州鄄城人，太平兴国五年进士。王小波、李顺起义后，他知益州，安抚百姓、整顿吏治、减轻赋税，蜀中得以安定。他还在蜀地推广交子、兴办学校，政绩卓著。张咏性格刚直，敢于弹劾权贵，卒谥忠定。</div>
