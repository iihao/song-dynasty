      <h1>方田均税法</h1>
      <p class="m-sub">北宋 · 新法 · 1072 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">土地</span><span class="tag">北宋</span><span class="tag">新法</span><span class="tag">田赋</span></div>
      
      <div class="m-detail">熙宁五年始行，以东西南北各千步为一方，按土质肥瘠分五等定税，清查豪强隐田与诡名寄产。方田均税在部分路份取得成效，但清丈成本高、地方执行不一，且触犯形势户利益，元丰后逐渐停滞，最终废罢。</div>
