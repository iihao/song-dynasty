      <div class="m-detail">907 年朱温灭唐建后梁，此后后唐、后晋、后汉、后周相继；南方则有吴、南唐、吴越、闽、楚、南汉、前蜀、后蜀、荆南、北汉等政权。各国政治、经济差异很大，吴越、南唐相对安定，文化延续。960 年北宋建立后，逐步削平诸国，至 979 年灭北汉完成统一。</div>
