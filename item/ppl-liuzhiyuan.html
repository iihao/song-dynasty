      <h1>刘知远</h1>
      <p class="m-sub">五代 · 帝王 · 生卒 895—948</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">五代</span><span class="tag grp">帝王</span><span class="tag">太原</span><span class="tag">后汉</span><span class="tag">沙陀</span></div>
      
      <div class="m-detail">刘知远为沙陀人，乘契丹灭晋、中原无主之际称帝于太原，后迁汴。后汉仅历二帝四年，是五代中最短的王朝，其部将郭威即后周开国之君。</div>
