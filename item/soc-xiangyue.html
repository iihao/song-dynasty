      <h1>乡约与《吕氏乡约》</h1>
      <p class="m-sub">北宋 · 基层</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">基层</span><span class="tag">北宋</span><span class="tag">乡约</span><span class="tag">教化</span></div>
      
      <div class="m-detail">《吕氏乡约》是中国现存最早的成文乡约，由吕大忠、吕大钧、吕大临等推行于陕西蓝田，规定同约人定期聚会、记录善恶、互相帮助。朱熹后来加以修订，收入《朱子家礼》系统。乡约把儒家伦理落实到基层，对明清乡约制度影响深远。</div>
