      <h1>八字军</h1>
      <p class="m-sub">南宋 · 兵制 · 1127 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">抗金</span><span class="tag">南宋</span><span class="tag">义军</span><span class="tag">太行山</span></div>
      
      <div class="m-detail">建炎元年，王彦率部在太行山抗金，部众相率刺面，以示决心。八字军转战河东、河北，后归附宗泽，成为南宋初年北方义军的重要力量。其成员多为忠义民兵，纪律与战力参差，但象征了沦陷区军民的抵抗意志。</div>
