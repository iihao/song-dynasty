      <h1>奴婢与人口买卖</h1>
      <p class="m-sub">两宋 · 阶层</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">两宋</span><span class="tag">奴婢</span><span class="tag">人口买卖</span><span class="tag">社会底层</span></div>
      
      <div class="m-detail">宋代禁止掠卖良人为奴婢，允许自愿雇佣与债务奴役，契约雇工在法律上高于奴婢。然而灾荒、贫困与高利贷仍迫使贫民卖儿卖女，南方少数民族地区与海外贸易中的人口贩卖亦未绝迹。官府屡禁不止，反映出社会底层的脆弱处境。</div>
