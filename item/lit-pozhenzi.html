      <h1>《破阵子·醉里挑灯看剑》</h1>
      <p class="m-sub">南宋 · 词 · 1188 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">辛弃疾</span><span class="tag">豪放</span><span class="tag">壮志</span></div>
      <div class="m-text"><h3>正文</h3><div class="m-text-body">醉里挑灯看剑，梦回吹角连营。
八百里分麾下炙，五十弦翻塞外声，
沙场秋点兵。
马作的卢飞快，弓如霹雳弦惊。
了却君王天下事，赢得生前身后名，
可怜白发生。</div></div>
      <div class="m-detail">名句：“了却君王天下事，赢得生前身后名。可怜白发生！”以壮语写悲情，形成强烈反差。</div>
