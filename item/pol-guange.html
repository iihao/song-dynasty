      <h1>馆阁与三馆秘阁</h1>
      <p class="m-sub">两宋 · 官制</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">官制</span><span class="tag">藏书</span><span class="tag">馆阁</span><span class="tag">清要</span></div>
      
      <div class="m-detail">三馆秘阁掌藏书、校勘、编修，馆职如直馆、直阁、校理、检讨，虽官品不高却为士人荣衔，常由进士高第或制科入选。馆阁是宰辅与词臣的养成所，欧阳修、苏轼、司马光等都曾任职；元丰改制后馆职渐虚，南宋复设秘书省统之。</div>
