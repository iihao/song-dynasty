      <h1>袁枢</h1>
      <p class="m-sub">南宋 · 文豪 · 生卒 1131—1205</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag grp">文豪</span><span class="tag">资治通鉴</span><span class="tag">南宋</span><span class="tag">史学家</span><span class="tag">纪事本末</span></div>
      
      <div class="m-detail">袁枢字机仲，建州建安人，隆兴元年进士。他喜读《资治通鉴》，因编年体一事散见诸卷，遂以事件为中心，辑成《通鉴纪事本末》四十二卷，开纪事本末体先河。该体以事为纲、首尾完整，对后世史学编纂影响深远。</div>
