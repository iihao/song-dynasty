      <h1>《生查子·元夕》</h1>
      <p class="m-sub">北宋 · 词 · 1035 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">欧阳修</span><span class="tag">存疑</span><span class="tag">元宵</span><span class="tag">月上柳梢头</span></div>
      <div class="m-text"><h3>正文</h3><div class="m-text-body">去年元夜时，花市灯如昼；月上柳梢头，人约黄昏后。
今年元夜时，月与灯依旧；不见去年人，泪湿春衫袖。</div></div>
      <div class="m-detail">上片写去年元夜的欢会，下片写今年“月与灯依旧，不见去年人”，以同景写异情。此词作者有争议，一说是朱淑真作，学界多归欧阳修，本库从通行说法并加标注。</div>
