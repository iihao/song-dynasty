      <div class="m-detail">汴京有“正店”七十二户，脚店、酒摊不计其数；临安酒楼以彩画、灯烛、器皿争胜，酒旗招展，昼夜营业。官府通过榷酒、卖酒曲控制酒利，酒楼也成为宴饮、饯别、谈判与娱乐的场所。宋词中大量送别、登楼之作，多以酒楼为背景。</div>
