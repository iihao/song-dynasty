      <p class="eyebrow">科技 · 医学</p>
      <h1>《太平惠民和剂局方》</h1>
      <p class="m-sub">两宋 · 医学 · 1107 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">医学</span><span class="tag">两宋</span><span class="tag">方剂</span><span class="tag">官药</span></div>
      
      <div class="m-detail">北宋设太医局熟药所，后改和剂局、惠民局，按方制药出售。大观年间陈师文等校正《和剂局方》，绍兴以后屡次增补，载方近八百首，规定药物炮制、剂量与用法。该书推动成药标准化与民间医药普及，也为后世方剂学奠定基础。</div>
