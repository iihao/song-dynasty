      <h1>钓鱼城之战</h1>
      <p class="m-sub">南宋 · 战役 · 1259 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">战役</span><span class="tag">南宋</span><span class="tag">蒙古</span><span class="tag">山城</span></div>
      
      <div class="m-detail">钓鱼城位于今重庆合川钓鱼山，控扼嘉陵江、渠江、涪江交汇，是四川山城防御体系的核心。1259 年蒙哥汗亲率大军围攻数月不下，蒙军疫病流行，蒙哥本人死于军中（一说中炮石，一说病逝），蒙古诸军北撤，南宋得以延续。</div>
