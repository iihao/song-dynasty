      <h1>好水川之战</h1>
      <p class="m-sub">北宋 · 战役 · 1041 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">北宋</span><span class="tag">战役</span><span class="tag">西夏</span><span class="tag">宋夏战争</span></div>
      
      <div class="m-detail">1041 年，宋将任福率军追击西夏军，轻敌冒进至好水川，被李元昊预设的伏兵包围。宋军阵亡惨重，任福战死，关中震动。此战与三川口、定川寨并称宋夏三大败，促使北宋转向筑寨防守与庆历和议。</div>
