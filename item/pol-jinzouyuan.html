      <h1>进奏院与邸报</h1>
      <p class="m-sub">两宋 · 官制</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">官制</span><span class="tag">信息</span><span class="tag">邸报</span><span class="tag">文书</span></div>
      
      <div class="m-detail">宋初进奏院隶给事中，后由都进奏院统一收发各地奏状与诏令，并按事目抄送诸路。邸报内容以诏令、任免、章奏为主，士大夫借此了解朝政；南宋临安有“报摊”售卖朝报。进奏院还承担官员赴阙、文书稽程等事务，是中央与地方信息流通的枢纽。</div>
