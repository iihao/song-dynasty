      <h1>《游山西村》</h1>
      <p class="m-sub">南宋 · 诗 · 1167 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">陆游</span><span class="tag">哲理</span><span class="tag">乡村</span></div>
      <div class="m-text"><h3>正文</h3><div class="m-text-body">莫笑农家腊酒浑，丰年留客足鸡豚。
山重水复疑无路，柳暗花明又一村。
箫鼓追随春社近，衣冠简朴古风存。
从今若许闲乘月，拄杖无时夜叩门。</div></div>
      <div class="m-detail">名句：“山重水复疑无路，柳暗花明又一村。”成为激励后人的千古名句。</div>
