      <h1>磨勘与考课</h1>
      <p class="m-sub">两宋 · 铨选</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">官制</span><span class="tag">考核</span><span class="tag">铨选</span><span class="tag">文官</span></div>
      
      <div class="m-detail">磨勘由审官院、吏部等机构主持，核对官员历任差遣、举主、资历与考课等第，合格者方可转官；考课则分善最、过失，地方官由监司按年考核。磨勘重资历、考课重实绩，二者结合构成文官升迁的常规轨道，也带来“循资守格”的弊端。</div>
