      <h1>市舶抽解与博买</h1>
      <p class="m-sub">两宋 · 贸易</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">海外贸易</span><span class="tag">市舶</span><span class="tag">两宋</span><span class="tag">税收</span></div>
      
      <div class="m-detail">海舶入港后，市舶司先“抽解”，按货物种类抽取十分之一至十分之三不等；再对犀角、象牙、香药等珍货“博买”，由官府统购。抽解与博买收入归中央，部分留作地方经费。南宋时市舶收入占财政比重上升，泉州、广州、明州因此繁荣。</div>
