      <h1>崖山海战</h1>
      <p class="m-sub">南宋 · 战役 · 1279 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">战役</span><span class="tag">南宋</span><span class="tag">海战</span><span class="tag">元</span></div>
      
      <div class="m-detail">1279 年，张弘范率元军进攻退守崖山的宋军，宋将张世杰以铁索连舟、结阵海上，被元军火攻与夹击。宋军大败，陆秀夫负幼帝赵昺投海，杨太后及军民十余万人殉难。崖山之后，南宋政权彻底终结，元朝统一全国。</div>
