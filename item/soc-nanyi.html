      <h1>南宋义役</h1>
      <p class="m-sub">南宋 · 役法</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">基层</span><span class="tag">役法</span><span class="tag">南宋</span><span class="tag">义役</span></div>
      
      <div class="m-detail">义役始于绍兴年间，婺州、处州等地民户按户等出钱买田，以田租助当役者，或轮流充役、众人补助。义役本意是互助，但常被豪强与胥吏操纵，田产被侵吞，反而加重下户负担。朱熹、叶适等都曾讨论义役利弊，反映南宋役法的深层困境。</div>
