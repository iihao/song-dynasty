      <h1>僧道与寺观经济</h1>
      <p class="m-sub">两宋 · 宗教</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">经济</span><span class="tag">两宋</span><span class="tag">宗教</span><span class="tag">寺观</span></div>
      
      <div class="m-detail">寺观通过皇帝赐田、信众捐施、购买与侵占积累产业，经营田庄、碾磨、店铺、借贷甚至海外贸易。僧道享有免役、免税等优待，度牒可买卖，成为政府筹款手段。寺观还承担救济、教育、医疗与公共工程，是地方社会的重要力量。</div>
