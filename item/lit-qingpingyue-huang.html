      <h1>《清平乐·春归何处》</h1>
      <p class="m-sub">北宋 · 词 · 1105 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">惜春</span><span class="tag">黄庭坚</span><span class="tag">问春</span><span class="tag">清新</span></div>
      <div class="m-text"><h3>正文</h3><div class="m-text-body">春归何处？寂寞无行路。
若有人知春去处，唤取归来同住。

春无踪迹谁知？除非问取黄鹂。
百啭无人能解，因风飞过蔷薇。</div></div>
      <div class="m-detail">“春归何处？寂寞无行路”发问；下片“春无踪迹谁知？除非问取黄鹂。百啭无人能解，因风飞过蔷薇”层层设想，以黄鹂、蔷薇作答，构思新奇而不失自然。</div>
