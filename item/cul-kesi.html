      <h1>缂丝与宋代织绣</h1>
      <p class="m-sub">两宋 · 工艺</p>

    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">工艺</span><span class="tag">两宋</span><span class="tag">缂丝</span><span class="tag">织绣</span></div>
      
      <div class="m-detail">缂丝又称“刻丝”，以生丝为经、彩色熟丝为纬，小梭局部回织，成品正反如一、细腻如画。北宋宣和画院画家参与粉本，朱克柔、沈子蕃等名家以摹织名人书画著称。宋代织绣还用于官服、宗教幡帐与书画装裱，体现手工业与艺术的结合。</div>
