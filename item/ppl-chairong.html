      <h1>柴荣</h1>
      <p class="m-sub">五代 · 帝王 · 生卒 921—959</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">五代</span><span class="tag grp">帝王</span><span class="tag">后周</span><span class="tag">北伐</span><span class="tag">高平之战</span><span class="tag">毁佛</span></div>
      
      <div class="m-detail">柴荣在位五年余，尝言“以十年开拓天下，十年养百姓，十年致太平”。954 年高平之战立威，继而整顿禁军、均定田租、限佛寺、疏汴河，959 年北伐辽境收三关，染病还京而卒，次年陈桥兵变。</div>
