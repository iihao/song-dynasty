      <h1>高梁河之战</h1>
      <p class="m-sub">北宋 · 战役 · 979 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">燕云</span><span class="tag">辽</span><span class="tag">北宋</span><span class="tag">战役</span></div>
      
      <div class="m-detail">979 年，宋军灭北汉后未经休整即围攻幽州，辽将耶律休哥、耶律斜轸率援军夹击。宋军久战疲惫，在高梁河一带溃败，太宗乘驴车南逃。此战暴露宋军指挥与后勤短板，也使辽宋攻守之势逐渐逆转。</div>
