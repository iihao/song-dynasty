      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">秋千</span><span class="tag">两宋</span><span class="tag">节令</span><span class="tag">斗草</span></div>
      
      <div class="m-detail">秋千以彩绳悬木、女子坐立其上，荡越高低为戏；斗草分“文斗”与“武斗”，以草名对答或拉扯草茎比韧。汴京、临安春日，仕女出郊荡秋千、斗草、蹴鞠、放风筝，形成热闹的春游图景。这些活动兼具竞技、审美与社交功能。</div>
