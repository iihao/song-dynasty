      <h1>《四书章句集注》</h1>
      <p class="m-sub">南宋 · 典籍 · 1190 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">理学</span><span class="tag">四书</span><span class="tag">南宋</span><span class="tag">朱熹</span></div>
      
      <div class="m-detail">朱熹以《大学》为入德之门，重订章句，以《中庸》为道统心法，并以“格物致知”“存天理、灭人欲”贯穿四书。该书融合汉唐注疏与二程理学，形成新的经典体系；元明清科举以之为官方教材，影响东亚近七百年。</div>
