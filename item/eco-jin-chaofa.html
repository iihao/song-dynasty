      <div class="m-tags"><span class="tag era">金</span><span class="tag">纸币</span><span class="tag">交钞</span><span class="tag">通检推排</span></div>
      
      <div class="m-detail">1154 年始行交钞，与铜钱并行。章宗以后对外用兵、用度不足，交钞印造无度，屡屡更名（宝券、通宝、宝泉），物价腾踊。通检推排本为均赋，执行中亦多扰民，两者同为金末财政崩坏的两条线索。</div>
