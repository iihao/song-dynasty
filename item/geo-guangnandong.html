      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">两宋</span><span class="tag">地理</span><span class="tag">路制</span><span class="tag">岭南</span></div>
      
      <div class="m-detail">广南东路以广州为中心，市舶司设于此，蕃商聚居形成“蕃坊”，香药、犀象、珠贝由此输入。广南还产盐、铁、荔枝与沉香，但开发程度低于江南，官员多视为远恶之地。南宋以后，泉州崛起，广州仍保持重要地位。</div>
