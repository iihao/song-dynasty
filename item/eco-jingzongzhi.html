      <h1>经总制钱与月桩钱</h1>
      <p class="m-sub">南宋 · 赋税</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">财政</span><span class="tag">南宋</span><span class="tag">杂税</span><span class="tag">军费</span></div>
      
      <div class="m-detail">经制钱始于北宋末，总制钱为南宋初加征，二者合并称经总制钱，多按商税、酒税、契税等附加征收；月桩钱则是按月摊派给地方的军费。此类杂税无固定税则，胥吏上下其手，成为南宋农民与商人负担加重的重要原因。</div>
