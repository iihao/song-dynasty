    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">范宽</span><span class="tag">北宋</span><span class="tag">山水</span><span class="tag">绘画</span></div>
      
      <div class="m-detail">画面上方巨峰壁立，占去大半空间，山脚溪水奔流，一队驮驴行旅穿行林间。范宽以“雨点皴”表现关陕山石的坚硬质感，墨色厚重、气势逼人。此图与郭熙《早春图》、李唐《万壑松风图》并称宋代山水三大名作。</div>
