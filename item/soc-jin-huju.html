      <h1>金代猛安谋克户与汉户</h1>
      <p class="m-sub">金 · 阶层</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">金</span><span class="tag">金</span><span class="tag">民族</span><span class="tag">猛安谋克</span><span class="tag">社会</span></div>
      
      <div class="m-detail">猛安谋克是女真军政合一组织，成员平时生产、战时出征，享有授田与免役优待。金灭辽、北宋后，大量汉人被编为州县户，承担夏秋两税与杂役；契丹、渤海等族另编。海陵王以后猛安谋克南迁、占地，与汉户矛盾加剧，金末签军与括地更激化民族与社会冲突。</div>
