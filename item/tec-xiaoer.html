      <h1>钱乙与《小儿药证直诀》</h1>
      <p class="m-sub">北宋 · 医学</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">北宋</span><span class="tag">医学</span><span class="tag">儿科</span><span class="tag">钱乙</span></div>
      
      <div class="m-detail">钱乙曾任太医丞，提出小儿“脏腑柔弱、易虚易实、易寒易热”，以五脏虚实辨治，创制六味地黄丸等名方。其弟子阎孝忠整理其医案与论述成书，系统总结小儿生理、病理、诊断与方药，对后世中医儿科影响极大。</div>
