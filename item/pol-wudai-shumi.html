      <h1>枢密院与使职政治</h1>
      <p class="m-sub">五代 · 官制 · 907 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">五代</span><span class="tag">枢密院</span><span class="tag">使职</span><span class="tag">武人政治</span></div>
      
      <div class="m-detail">唐末枢密使本以宦官充任，五代改由士人、武将出任，掌军令与机密，与宰相分权。中央实权不在三省，而在临时差遣的“使职”；地方则由节度使兼领支郡。宋初“二府三司”正是对这一格局的收编与制度化。</div>
