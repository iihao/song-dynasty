      <div class="m-detail">史达祖词长于描摹物态、工于对仗，深受姜夔、张镃推重。《双双燕·咏燕》《绮罗香·咏春雨》为其代表作。因依附韩侂胄，后世对其人品颇有争议，但词艺公认精工。</div>
