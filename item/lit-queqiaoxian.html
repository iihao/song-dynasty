      <h1>《鹊桥仙·纤云弄巧》</h1>
      <p class="m-sub">北宋 · 词 · 1090 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">秦观</span><span class="tag">七夕</span><span class="tag">爱情</span></div>
      <div class="m-text"><h3>正文</h3><div class="m-text-body">纤云弄巧，飞星传恨，银汉迢迢暗度。
金风玉露一相逢，便胜却人间无数。
柔情似水，佳期如梦，忍顾鹊桥归路。
两情若是久长时，又岂在朝朝暮暮。</div></div>
      <div class="m-detail">名句：“两情若是久长时，又岂在朝朝暮暮。”成为千古传诵的爱情名句。</div>
