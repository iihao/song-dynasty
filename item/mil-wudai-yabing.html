      <h1>牙兵与藩镇兵制</h1>
      <p class="m-sub">五代 · 兵制 · 907 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">五代</span><span class="tag">牙兵</span><span class="tag">藩镇</span><span class="tag">兵变</span></div>
      
      <div class="m-detail">牙兵本为节度使亲兵，粮饷优厚、父子相袭，魏博牙兵尤以“长安天子，魏府牙军”自诩。骄兵逐帅、拥立留后成为常态，五代五十三年兵变不绝，直至宋初收兵权、行更戍才告终结。</div>
