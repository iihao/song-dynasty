      <h1>《钗头凤·红酥手》</h1>
      <p class="m-sub">南宋 · 词 · 1155 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">陆游</span><span class="tag">爱情</span><span class="tag">唐婉</span></div>
      <div class="m-text"><h3>正文</h3><div class="m-text-body">红酥手，黄縢酒，满城春色宫墙柳。
东风恶，欢情薄，一怀愁绪，几年离索，错！错！错！
春如旧，人空瘦，泪痕红浥鲛绡透。
桃花落，闲池阁，山盟虽在，锦书难托，莫！莫！莫！</div></div>
      <div class="m-detail">名句：“山盟虽在，锦书难托。莫、莫、莫！”唐婉和作“世情薄，人情恶”，不久抑郁而终。</div>
