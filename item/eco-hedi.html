      <h1>和籴与和买</h1>
      <p class="m-sub">两宋 · 赋税</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">财政</span><span class="tag">两宋</span><span class="tag">征购</span><span class="tag">农民</span></div>
      
      <div class="m-detail">和籴是官府按价收购粮食，和买则是预支钱款、后以绢帛偿还，或直接征购布帛。北宋中期以后，和籴、和买逐渐变为定额摊派，价格低于市价，甚至不给钱，成为农民沉重负担。南宋的折帛钱、经总制钱等，多由和买、和籴转化而来。</div>
