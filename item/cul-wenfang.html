      <h1>文房四宝与宋砚</h1>
      <p class="m-sub">两宋 · 文房</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">两宋</span><span class="tag">文房</span><span class="tag">砚台</span><span class="tag">书斋</span></div>
      
      <div class="m-detail">宋代士大夫普遍参与书画、藏书与文具鉴赏，文房成为文人身份与审美的载体。端砚产于广东端州，歙砚产于安徽歙州，均以石质温润、发墨不损毫著称；澄泥砚则以陶土烧制。宋人还讲究笔架、水滴、镇纸、香炉等配套器具，形成完整的书斋文化。</div>
