      <h1>南唐后主 李煜</h1>
      <p class="m-sub">五代 · 帝王 · 生卒 937—978</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">五代</span><span class="tag grp">帝王</span><span class="tag">五代</span><span class="tag">南唐</span><span class="tag">帝王</span><span class="tag">词人</span></div>
      
      <div class="m-detail">李煜字重光，南唐元宗李璟第六子，961 年即位，975 年宋军攻破金陵，降宋，被封违命侯，978 年被赐死。他前期词多写宫廷享乐，亡国后所作《虞美人》《浪淘沙》《相见欢》等，以血泪写故国之思，艺术成就极高，对宋词发展影响深远。</div>
