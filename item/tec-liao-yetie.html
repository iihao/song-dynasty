      <div class="m-tags"><span class="tag era">辽</span><span class="tag">冶铁</span><span class="tag">马具</span><span class="tag">契丹鞍</span></div>
      
      <div class="m-detail">辽东京辽阳府及饶州等地设有铁冶，出土铁农具、兵刃与铁锅可见其规模。契丹鞍具以金银装饰、结构合理著称，宋人称“契丹鞍”为天下第一；马具的成熟也放大了轻骑突袭的战术优势。</div>
