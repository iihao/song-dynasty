      <p class="eyebrow">政治制度 · 官制</p>
      <h1>登闻鼓院与直诉</h1>
      <p class="m-sub">两宋 · 官制</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">司法</span><span class="tag">官制</span><span class="tag">直诉</span><span class="tag">民意</span></div>
      
      <div class="m-detail">鼓院掌受文武官员及士民章奏表疏，检院则复核、分类进呈；鼓院前设鼓，击鼓以闻。制度本意是开通下情、纠察冤滞，但实际常受中书、枢密与台谏干预，平民直诉成功率有限。南宋以后鼓院仍存，成为京城的象征性申诉渠道。</div>
