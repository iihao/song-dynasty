      <h1>致仕与祠禄</h1>
      <p class="m-sub">两宋 · 官制</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">官制</span><span class="tag">致仕</span><span class="tag">祠禄</span><span class="tag">养老</span></div>
      
      <div class="m-detail">官员年七十可申请致仕，朝廷给半俸并荫补子孙；不愿或不能致仕者，可除宫观、岳庙等祠禄官，名义上管理道教宫观，实际居家领俸。祠禄官后来成为安置罢黜、调停党争的缓冲带，朱熹、陆九渊等都曾领祠职。</div>
