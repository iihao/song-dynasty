      <h1>襄樊之战</h1>
      <p class="m-sub">南宋 · 战役 · 1267–1273 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">战役</span><span class="tag">南宋</span><span class="tag">襄阳</span><span class="tag">元</span></div>
      
      <div class="m-detail">1267 年起，元军以阿术、刘整为主力围困襄阳，筑城连堡、训练水军，切断宋军援路。宋军张世杰、范文虎等多次救援失败，吕文焕困守六年，1273 年樊城先陷，襄阳降元。襄樊失守后元军顺汉水入长江，南宋防线全面崩溃。</div>
