      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">两宋</span><span class="tag">节令</span><span class="tag">花朝</span><span class="tag">游春</span></div>
      
      <div class="m-detail">花朝节又称“百花生日”，临安人赴郊外赏梅、桃、杏，或到园圃挑菜、扑蝶，宫中也有赏花宴。周密《武林旧事》记南宋宫廷于花朝前后赏花、进花。花朝与清明、上巳相连，构成宋代春季连续的游春时节。</div>
