      <div class="m-detail">两浙路以杭州、苏州、湖州、明州、越州为核心，稻米、丝织、瓷器、茶叶与海外贸易发达，临安（杭州）为南宋行在。两浙也是科举、刻书、书画与园林的重镇，所谓“上有天堂，下有苏杭”即在宋代奠定基础。</div>
