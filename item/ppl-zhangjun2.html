      <h1>张俊</h1>
      <p class="m-sub">南宋 · 名将 · 生卒 1086—1154</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag grp">名将</span><span class="tag">南宋</span><span class="tag">岳飞</span><span class="tag">名将</span><span class="tag">中兴四将</span></div>
      
      <div class="m-detail">张俊字伯英，凤翔府成纪人，行伍出身，靖康后在江淮抗金，曾任御前诸军都统制。他与岳飞、韩世忠、刘光世并称中兴四将，但后期攀附秦桧，参与诬陷岳飞，为后世所讥。晚年封清河郡王，极尽富贵。</div>
