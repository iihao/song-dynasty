      <h1>禹迹图与华夷图</h1>
      <p class="m-sub">南宋 · 地图 · 1136 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">两宋</span><span class="tag">石刻</span><span class="tag">地图</span><span class="tag">地理</span></div>
      
      <div class="m-detail">《禹迹图》以“计里画方”法绘出山川、河流、州县，比例大致可考；《华夷图》则兼绘周边政权与海域。两图虽托名大禹、华夷，实际反映宋代地理知识与制图水平，现存西安碑林。《禹迹图》的方格网比欧洲同类地图早数百年。</div>
