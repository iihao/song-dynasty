      <h1>岳飞昭雪</h1>
      <p class="m-sub">南宋 · 事件 · 1162 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">事件</span><span class="tag">平反</span><span class="tag">南宋</span><span class="tag">岳飞</span></div>
      
      <div class="m-detail">岳飞于绍兴十一年被秦桧以“莫须有”罪名害死。孝宗即位后，志在恢复，遂下诏追复岳飞元官，以礼改葬于西湖栖霞岭，并访求其后。淳熙五年，赐谥“武穆”；嘉定四年，追封鄂王。岳飞的平反成为南宋政治转向与主战派士气的重要象征。</div>
