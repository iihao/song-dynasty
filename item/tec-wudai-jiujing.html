      <h1>官刻九经</h1>
      <p class="m-sub">五代 · 印刷 · 932 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">五代</span><span class="tag">雕版印刷</span><span class="tag">冯道</span><span class="tag">九经</span></div>
      
      <div class="m-detail">932 年冯道、李愚奏请依石经文字雕版印卖九经，历后唐、后晋、后汉、后周，至 953 年始毕。此举把雕版印刷从民间历书、佛经推向经典文本，为宋代刻书业与国家出版奠定范式。</div>
