      <h1>辽代儒学与五京学</h1>
      <p class="m-sub">辽 · 学术 · 916 年</p>

    <div class="modal-body">
      <div class="m-tags"><span class="tag era">辽</span><span class="tag">科举</span><span class="tag">儒学</span><span class="tag">五京学</span></div>
      
      <div class="m-detail">辽太祖立国即建孔庙，太宗得燕云后沿用汉地学校与科举。五京置国子学，设博士、助教，士人读《五经》而重章句。儒学为契丹贵族提供了“以汉制治汉人”的意识形态工具，与佛教共同构成辽代上层的精神世界。</div>
