      <h1>西夏部落与监军司</h1>
      <p class="m-sub">西夏 · 结构 · 1038 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">西夏</span><span class="tag">党项</span><span class="tag">监军司</span><span class="tag">族帐</span></div>
      
      <div class="m-detail">党项部落以“族帐”为单元，首领世袭、部民附籍。元昊划全境为十二监军司，各统军数万，平时牧耕、战时征发，地方长官兼理军民两政。这种部落—军区叠合的结构，使西夏动员力强而行政精度有限。</div>
