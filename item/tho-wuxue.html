      <h1>婺学（吕祖谦）</h1>
      <p class="m-sub">南宋 · 学派</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">理学</span><span class="tag">史学</span><span class="tag">南宋</span><span class="tag">婺学</span></div>
      
      <div class="m-detail">吕祖谦与朱熹、张栻并称“东南三贤”，主讲丽泽书院，编《宋文鉴》《东莱博议》，主张“理”在史事中体现，治学不专主一心而兼重制度、文献与文章。婺学培养出陈亮、叶适等浙东学者，对南宋事功学风影响深远。</div>
