      <h1>苏州石刻天文图与漏刻</h1>
      <p class="m-sub">南宋 · 天文 · 1247 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">两宋</span><span class="tag">天文</span><span class="tag">星图</span><span class="tag">仪器</span></div>
      
      <div class="m-detail">图碑由黄裳绘制、王致远刻石，上部为星图，下部为说明文字，共刻恒星一千四百余颗，反映当时对星官、银河与黄道的认识。宋代还改进漏刻与浑仪，苏颂、韩公廉所造水运仪象台集观测、演示与报时于一体，代表当时天文仪器的最高水平。</div>
