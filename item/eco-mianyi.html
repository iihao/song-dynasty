      <p class="eyebrow">经济 · 新法</p>
      <h1>免役法</h1>
      <p class="m-sub">北宋 · 新法 · 1071 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">财政</span><span class="tag">北宋</span><span class="tag">新法</span><span class="tag">役法</span></div>
      
      <div class="m-detail">熙宁四年推行，将原本按户等轮差的职役改为纳钱免役，官户、坊郭户、单丁、女户等也需出助役钱。此法减轻了上户的差役负担，却增加了下户与坊郭户的货币支出，执行中又有宽剩钱之弊。元祐时复差役，绍圣后再行雇役，南宋役法更趋复杂。</div>
