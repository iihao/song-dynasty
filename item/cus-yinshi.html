      <h1>宋代面食与米食</h1>
      <p class="m-sub">两宋 · 饮食</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">饮食</span><span class="tag">面食</span><span class="tag">两宋</span><span class="tag">米食</span></div>
      
      <div class="m-detail">汴京、临安的面食有馒头、包子、馄饨、饺子（角子）、面条、饼等，米食有饭、粥、糕、团、粽子。城市饮食业发达，面馆分“南食”“北食”“川饭”，还有专卖包子、馒头、汤饼的店铺。宋代饮食的多样化与商业化，反映了城市生活的繁荣。</div>
