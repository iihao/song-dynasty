      <p class="m-sub">西夏 · 城市 · 1038 年</p>

      <div class="m-detail">黑水城扼居延故道，是西夏北境军事与贸易据点。1908—1909 年科兹洛夫在此掘得西夏文、汉文文书与佛画数千件，与敦煌遗书并称为西夏研究的两大支柱。</div>
