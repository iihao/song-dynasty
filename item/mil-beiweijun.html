      <h1>背嵬军</h1>
      <p class="m-sub">南宋 · 兵制 · 1140 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">骑兵</span><span class="tag">精锐</span><span class="tag">南宋</span><span class="tag">岳家军</span></div>
      
      <div class="m-detail">“背嵬”意为大将亲随，岳飞选骁勇之士组成背嵬军，分骑兵与步兵，装备精良、训练严整。郾城之战中，背嵬军以麻扎刀、提刀等破金军拐子马；颍昌之战又正面击溃金军主力。岳家军以“冻死不拆屋，饿死不掳掠”著称，背嵬军是其军纪与战力的集中体现。</div>
