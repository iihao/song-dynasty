      <h1>邮驿与递铺</h1>
      <p class="m-sub">两宋 · 交通</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">交通</span><span class="tag">两宋</span><span class="tag">信息</span><span class="tag">邮驿</span></div>
      
      <div class="m-detail">递铺每十里或二十里一置，铺兵接力传送，急脚递日行四百里，金字牌急脚递可日行五百里。驿站则供官员住宿、换马。宋代邮驿由枢密院与兵部管理，路线以汴京、临安为中心辐射全国。岳飞被十二道金牌召还，即是急脚递的著名事例。</div>
