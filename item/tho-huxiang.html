      <div class="m-detail">胡宏师承杨时、胡安国，著《知言》，提出“性立天下之有”，把性视为宇宙本体；张栻续其学，主讲岳麓书院，与朱熹反复论辩“中和”“仁说”。湖湘学派强调体用合一、知行并进，培养出吴猎、彭龟年等一批抗金与理政人才。</div>
