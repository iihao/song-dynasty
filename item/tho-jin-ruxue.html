      <div class="m-detail">金世宗、章宗倡文治，设国子监、开科取士，士人宗苏轼之文而疑程学之严。赵秉文主“文以载道”而尚气格，王若虚以《滹南遗老集》辨经史之失，李纯甫好佛而杂禅。金亡后，元好问以诗文存一代文献。</div>
