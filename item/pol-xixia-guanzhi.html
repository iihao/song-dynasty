      <h1>西夏官制（蕃汉并行）</h1>
      <p class="m-sub">西夏 · 官制 · 1038 年</p>

    <div class="modal-body">
      <div class="m-tags"><span class="tag era">西夏</span><span class="tag">官制</span><span class="tag">蕃汉</span><span class="tag">元昊</span></div>
      
      <div class="m-detail">元昊称帝后设汉制中枢——中书、枢密、三司、御史台，又保留宁令、谟宁令等蕃官名号与部落“首领—族帐”结构。文书夏汉并用，官制因此带有双重性格。</div>
