      <h1>石油与沈括</h1>
      <p class="m-sub">北宋 · 矿冶</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">北宋</span><span class="tag">科技</span><span class="tag">沈括</span><span class="tag">石油</span></div>
      
      <div class="m-detail">沈括知延州时，见当地泉水中有黑色油脂可燃，收集燃烧并命名“石油”，还以石油烟制墨。他注意到石油“生于水际沙石”“与泉水相杂”，并推断其地下来源。宋代陕北、川北已有土法开采与利用，沈括的记载是世界石油史上最早的明确文献之一。</div>
