      <h1>西夏儒学与番汉之学</h1>
      <p class="m-sub">西夏 · 学术 · 1146 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">西夏</span><span class="tag">儒学</span><span class="tag">译经</span><span class="tag">番学</span><span class="tag">庙学</span></div>
      
      <div class="m-detail">仁宗李仁孝人庆年间各州普建庙学，1146 年尊孔子为文宣帝，又设番学以党项文教授。西夏以夏汉两文对译儒经与类书，形成“番汉并行”的学术格局：既用儒学建构君臣伦理，也以党项文字维系本族认同。</div>
