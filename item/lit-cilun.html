      <div class="m-detail">文中历评唐五代至北宋诸家，谓柳永“词语尘下”、张先宋祁“破碎”、晏殊欧阳修苏轼“句读不葺之诗”，主张词须协律、典雅、铺叙、故实。其批评虽苛，却第一次系统地为词争取独立的文体地位，是研究宋词观念的核心材料。</div>
