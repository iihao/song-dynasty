      <h1>朱温</h1>
      <p class="m-sub">五代 · 帝王 · 生卒 852—912</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">五代</span><span class="tag grp">帝王</span><span class="tag">后梁</span><span class="tag">唐亡</span><span class="tag">汴州</span></div>
      
      <div class="m-detail">朱温出身砀山，归唐后赐名全忠，与河东李克用争雄数十年。907 年受禅称帝，都汴州。晚年荒暴，为亲子朱友珪所弑。后梁历三主十七年，923 年为后唐所灭。</div>
