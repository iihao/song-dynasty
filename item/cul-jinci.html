      <h1>晋祠圣母殿与宋塑</h1>
      <p class="m-sub">北宋 · 建筑</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">北宋</span><span class="tag">建筑</span><span class="tag">彩塑</span><span class="tag">晋祠</span></div>
      
      <div class="m-detail">圣母殿面阔七间、重檐歇山，采用减柱造与“副阶周匝”，是宋代木构建筑的重要实例。殿内彩塑以邑姜（圣母）居中，侍女像姿态各异、神情含蓄，衣饰与发式保存了北宋宫廷生活的细节。它与《营造法式》相互印证，是研究宋代建筑与雕塑的珍贵实物。</div>
