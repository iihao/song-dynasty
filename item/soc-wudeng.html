      <h1>五等户与户等</h1>
      <p class="m-sub">两宋 · 户籍</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">户籍</span><span class="tag">两宋</span><span class="tag">户等</span><span class="tag">赋役</span></div>
      
      <div class="m-detail">一等户田产最多，五等户最少；坊郭户另分十等。户等由地方官府三年一定，用于差役、免役钱、和籴、赈济等。实际操作中，形势户与胥吏常通过诡名寄产、析户等手段降低户等，转嫁负担，导致“上户轻、下户重”的积弊。</div>
