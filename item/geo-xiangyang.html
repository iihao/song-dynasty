      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">襄阳</span><span class="tag">汉水</span><span class="tag">围城</span></div>
      
      <div class="m-detail">襄阳与樊城夹汉水对峙，为控扼荆襄、通达江汉的枢纽。宋元战争中元军筑堡连营、断其援路，守将吕文焕坚守六年后出降。襄阳既失，元军顺汉入江，直取鄂州、临安。</div>
