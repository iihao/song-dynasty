      <h1>公田法推行</h1>
      <p class="m-sub">南宋 · 事件 · 1263 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">财政</span><span class="tag">事件</span><span class="tag">南宋</span><span class="tag">公田</span></div>
      
      <div class="m-detail">南宋末年财政危机，贾似道采纳知临安府刘良贵等建议，按官户、民户田产超额部分强行回买为公田，再以公田租入充军饷。公田法触动大地主利益，执行中压价、强买、虚报，导致民间骚动，反而加剧社会矛盾，成为南宋灭亡的重要诱因之一。</div>
