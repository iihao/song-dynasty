      <h1>庆元党禁</h1>
      <p class="m-sub">南宋 · 事件 · 1195 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">理学</span><span class="tag">党争</span><span class="tag">南宋</span><span class="tag">庆元</span></div>
      
      <div class="m-detail">1195 年起，韩侂胄借“伪学”之名排挤赵汝愚、朱熹及道学人士，订立“伪学逆党籍”，禁止理学书籍与科举引用。党禁持续数年，朱熹在忧愤中去世。嘉定以后理学逐渐平反，至淳祐年间官学化，庆元党禁反而强化了道学的道统意识。</div>
