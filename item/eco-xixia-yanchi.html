      <h1>西夏盐池与青白盐</h1>
      <p class="m-sub">西夏 · 产业 · 1038 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">西夏</span><span class="tag">盐池</span><span class="tag">青白盐</span><span class="tag">榷禁</span></div>
      
      <div class="m-detail">西夏盐池产量大、成本低，宋人常以谷物易盐。北宋为保护解盐专卖，屡禁青白盐入境，边民却因价廉而私贩不绝。盐禁与盐利因此成为宋夏和战之外的另一条战线。</div>
