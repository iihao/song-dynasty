      <h1>《浪淘沙·把酒祝东风》</h1>
      <p class="m-sub">北宋 · 词 · 1050 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">欧阳修</span><span class="tag">惜春</span><span class="tag">聚散</span><span class="tag">今年花胜去年红</span></div>
      <div class="m-text"><h3>正文</h3><div class="m-text-body">把酒祝东风，且共从容。
垂杨紫陌洛城东。
总是当时携手处，游遍芳丛。

聚散苦匆匆，此恨无穷。
今年花胜去年红。
可惜明年花更好，知与谁同。</div></div>
      <div class="m-detail">上片写与友携酒游春，“垂杨紫陌洛城东”点出洛阳；下片由花之盛衰想到人事聚散。全词语言平易而情感深挚，体现欧词“疏隽”的一面。</div>
