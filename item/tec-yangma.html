      <h1>秧马与龙骨车</h1>
      <p class="m-sub">两宋 · 农具</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">江南</span><span class="tag">农业</span><span class="tag">两宋</span><span class="tag">农具</span></div>
      
      <div class="m-detail">秧马是一种可骑坐滑行的插秧工具，苏轼在湖北、江东见其便，作《秧马歌》推广；龙骨车即翻车，以人力、畜力或水力提水，宋代江南圩田广泛使用。农具改进与占城稻、稻麦复种相结合，推动宋代农业产量与人口增长。</div>
