      <h1>《鹧鸪天·彩袖殷勤捧玉钟》</h1>
      <p class="m-sub">北宋 · 词 · 1085 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">婉约</span><span class="tag">晏几道</span><span class="tag">重逢</span><span class="tag">舞低杨柳楼心月</span></div>
      <div class="m-text"><h3>正文</h3><div class="m-text-body">彩袖殷勤捧玉钟。
当年拼却醉颜红。
舞低杨柳楼心月，歌尽桃花扇底风。
从别后，忆相逢。
几回魂梦与君同。
今宵剩把银缸照，犹恐相逢是梦中。</div></div>
      <div class="m-detail">上片追忆当年欢宴，以月落、风尽写彻夜歌舞；下片写久别重逢，“今宵剩把银釭照，犹恐相逢是梦中”把疑真疑幻的心理写得极细腻。</div>
