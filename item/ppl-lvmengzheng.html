      <h1>吕蒙正</h1>
      <p class="m-sub">北宋 · 名臣 · 生卒 944—1011</p>

    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag grp">名臣</span><span class="tag">科举</span><span class="tag">宰相</span><span class="tag">北宋</span><span class="tag">名臣</span></div>
      
      <div class="m-detail">吕蒙正字圣功，河南洛阳人，太平兴国二年状元。太宗朝拜相，敢于直言，曾谏太宗“弭兵省财”；真宗朝再相，以老病归。他出身贫寒，深知民间疾苦，主张宽恤民力，所荐著者如富言、陈恕等。卒谥文穆。</div>
