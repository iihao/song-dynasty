      <h1>《近思录》</h1>
      <p class="m-sub">南宋 · 典籍 · 1175 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">理学</span><span class="tag">南宋</span><span class="tag">朱熹</span><span class="tag">道统</span></div>
      
      <div class="m-detail">淳熙二年，朱熹、吕祖谦在寒泉精舍编成《近思录》十四卷，按“道体、为学、致知、存养、克己、家道、出处、治体”等门类编排，把北宋四子之学整合为系统。该书成为后世理学入门书，也确立了周程张朱的道统脉络。</div>
