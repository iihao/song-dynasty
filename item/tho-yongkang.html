    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">南宋</span><span class="tag">永康</span><span class="tag">事功</span><span class="tag">义利</span></div>
      
      <div class="m-detail">陈亮字同甫，婺州永康人，与朱熹展开“王霸义利”之辩，反对以三代为空言、以汉唐为霸道，强调历史发展的连续性与事功价值。其学鼓励抗金、改革，文章气势豪迈，对后世浙东学术与经世思想影响很大。</div>
