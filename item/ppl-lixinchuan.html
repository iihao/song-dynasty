      <h1>李心传</h1>
      <p class="m-sub">南宋 · 文豪 · 生卒 1167—1244</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag grp">文豪</span><span class="tag">南宋</span><span class="tag">史学家</span><span class="tag">编年</span><span class="tag">高宗朝</span></div>
      
      <div class="m-detail">李心传字微之，隆州井研人。他长期家居著述，广搜官私文献，编成《建炎以来系年要录》二百卷，记建炎元年至绍兴三十二年史事，与李焘《长编》相接；又有《朝野杂记》记典章制度与朝野见闻。二书是研究南宋初期历史的核心史料。</div>
