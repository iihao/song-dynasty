      <h1>《证类本草》</h1>
      <p class="m-sub">北宋 · 医学</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">北宋</span><span class="tag">医学</span><span class="tag">本草</span><span class="tag">唐慎微</span></div>
      
      <div class="m-detail">唐慎微在《嘉祐本草》《本草图经》基础上增补药物与单方，成《经史证类备急本草》，收药一千五百余种，附方三千余首，并保留大量今已失传的医药文献。大观、政和年间官方校定刊行，改称《政和本草》，成为宋元明本草学的主要依据。</div>
