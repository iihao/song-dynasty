      <h1>洪迈</h1>
      <p class="m-sub">南宋 · 文豪 · 生卒 1123—1202</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag grp">文豪</span><span class="tag">笔记</span><span class="tag">南宋</span><span class="tag">文豪</span><span class="tag">夷坚志</span></div>
      
      <div class="m-detail">洪迈字景卢，饶州鄱阳人，洪皓之子，绍兴十五年中博学宏词科。他曾出使金国，后官至翰林学士、端明殿学士。所著《容斋随笔》考据精博，《夷坚志》收录大量志怪与民间故事，是宋代笔记小说的代表作。他还参与修撰《四朝国史》。</div>
