      <h1>杨存中</h1>
      <p class="m-sub">南宋 · 名将 · 生卒 1102—1166</p>

    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag grp">名将</span><span class="tag">禁军</span><span class="tag">南宋</span><span class="tag">高宗</span><span class="tag">名将</span></div>
      
      <div class="m-detail">杨存中字正甫，代州崞县人，杨业之后。绍兴年间任殿前都指挥使，掌禁军二十余年，参与藕塘、柘皋等战。他善于揣摩上意，深得高宗宠信，但在岳飞案中附和秦桧。孝宗朝封和王，卒谥武恭。</div>
