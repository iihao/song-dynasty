      <h1>荆湖北路</h1>
      <p class="m-sub">两宋 · 路制</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">两宋</span><span class="tag">地理</span><span class="tag">路制</span><span class="tag">长江</span></div>
      
      <div class="m-detail">荆湖北路以江陵、鄂州、岳州为中心，长江、汉水与洞庭湖水系交汇，漕运与商旅繁盛。鄂州（今武汉）是长江中游大港，江陵为军事重镇。宋金、宋元战争中，荆湖北路多次成为拉锯战场，襄阳、鄂州尤其关键。</div>
