      <h1>西夏秃发与服饰</h1>
      <p class="m-sub">西夏 · 发式 · 1038 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">西夏</span><span class="tag">服饰</span><span class="tag">元昊</span><span class="tag">秃发</span></div>
      
      <div class="m-detail">党项旧俗本有髡发之习，元昊建号后明令境内秃发，以发式为政权标识；同时定官服品色，文官幞头、武官冠饰各有等差。发式与衣冠由此成为西夏“别宋辽而自立”的符号。</div>
