      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">两宋</span><span class="tag">疫病</span><span class="tag">公共卫生</span><span class="tag">救济</span></div>
      
      <div class="m-detail">两宋记载的疫灾频繁，临安、汴京等大城市尤甚。朝廷常派医官、颁药方、设惠民药局，地方官组织施药、隔离、埋葬死者；寺院与民间善会也参与救济。宋代还出现“病坊”“安济坊”等收容机构，虽规模有限，却体现国家对公共卫生的介入。</div>
