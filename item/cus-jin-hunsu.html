      <h1>金代女真婚俗</h1>
      <p class="m-sub">金 · 婚俗</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">金</span><span class="tag">金</span><span class="tag">女真</span><span class="tag">民族</span><span class="tag">婚俗</span></div>
      
      <div class="m-detail">女真旧俗有“父死则妻其母”的收继婚，也有指腹为婚、以马匹为聘等；婚礼有拜门、纳币、亲迎等程序。金代中期以后，受汉人礼制影响，婚俗渐趋隆重，但收继婚在民间仍存。金代婚姻制度反映了女真旧俗与汉文化的碰撞融合。</div>
