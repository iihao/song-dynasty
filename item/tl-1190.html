      <h1>朱熹《四书章句集注》成书</h1>
      <p class="m-sub">南宋 · 事件 · 1190 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">科举</span><span class="tag">事件</span><span class="tag">四书</span><span class="tag">南宋</span></div>
      
      <div class="m-detail">朱熹自隆兴以来反复修改《大学》《中庸》章句与《论语》《孟子》集注，至绍熙元年刊行。该书以理学观点重新解释四书，构建“格物、致知、诚意、正心”的为学次第。元皇庆二年恢复科举，以四书朱注为标准，影响中国与东亚六百余年。</div>
