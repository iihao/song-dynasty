    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">汴京</span><span class="tag">北宋</span><span class="tag">风俗画</span><span class="tag">绘画</span></div>
      
      <div class="m-detail">画卷以汴河为中心，从郊野、虹桥到城内街市，绘有士农工商、舟车轿马、店铺摊贩等数百人物，细致呈现了宋代城市的经济生活与社会风貌。该图不仅是艺术杰作，也是研究汴京城市、交通、商业与服饰的一手图像资料。</div>
