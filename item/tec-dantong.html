      <p class="eyebrow">科技 · 冶金</p>
      <h1>胆铜法与湿法炼铜</h1>
      <p class="m-sub">两宋 · 冶金</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">两宋</span><span class="tag">冶金</span><span class="tag">胆铜</span><span class="tag">化学</span></div>
      
      <div class="m-detail">胆铜法基于铁与硫酸铜的置换反应，把铁片浸入胆水，铜析出后刮取冶炼。北宋在信州铅山、饶州德兴等地设场生产，南宋进一步发展，胆铜产量一度占全国铜产的重要份额。该技术是世界冶金史上最早的湿法炼铜大规模应用之一。</div>
