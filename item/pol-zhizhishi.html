      <p class="eyebrow">政治制度 · 使职</p>
      <h1>制置使与宣抚使</h1>
      <p class="m-sub">两宋 · 使职</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">使职</span><span class="tag">地方</span><span class="tag">官制</span><span class="tag">军政</span></div>
      
      <div class="m-detail">制置使多设于沿边、沿江要地，掌一路或数路军政、财赋与防务，如四川制置使、江淮制置使；宣抚使则多以宰执、大将充任，负责宣抚军民、节制诸将。二者并非常设，因战事而置，事已则罢，容易与转运使、安抚使职权交错。</div>
