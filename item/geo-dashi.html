      <h1>大食与阿拉伯海贸</h1>
      <p class="m-sub">两宋 · 邦交</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">海外贸易</span><span class="tag">两宋</span><span class="tag">邦交</span><span class="tag">大食</span></div>
      
      <div class="m-detail">大食商人经印度洋、马六甲海峡抵达中国，输入香药、犀角、象牙、珠宝、玻璃，输出瓷器、丝绸、茶叶与铜钱。宋政府在广州设蕃坊、置蕃长，允许穆斯林商人聚居、贸易与信仰。大食海贸是宋代海上丝绸之路的重要组成部分。</div>
