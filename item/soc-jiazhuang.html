      <h1>嫁妆与女性财产</h1>
      <p class="m-sub">两宋 · 婚姻</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">女性</span><span class="tag">两宋</span><span class="tag">婚姻</span><span class="tag">财产</span></div>
      
      <div class="m-detail">宋代厚嫁之风盛行，嫁妆包括田产、房宅、金银、布帛与奴婢，富家嫁女甚至倾家。法律上，嫁妆属妻子私产，离婚或守寡时可带走，寡妇无子也可承分夫家财产。但嫁妆也加剧了溺女、晚婚与贫家娶妻难等社会问题。</div>
