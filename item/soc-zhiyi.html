      <h1>职役与差役</h1>
      <p class="m-sub">两宋 · 役法</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">基层</span><span class="tag">役法</span><span class="tag">两宋</span><span class="tag">民户</span></div>
      
      <div class="m-detail">职役不是徭役，而是协助官府管理赋税、治安、仓场等事务，但衙前押运官物、里正催税赔补，常致上户破产。北宋前期差役矛盾尖锐，王安石改行免役法；南宋差役与雇役并行，义役、助役等地方办法相继出现，但胥吏盘剥仍未解决。</div>
