      <h1>秦凤路</h1>
      <p class="m-sub">北宋 · 路制</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">北宋</span><span class="tag">地理</span><span class="tag">路制</span><span class="tag">宋夏</span></div>
      
      <div class="m-detail">秦凤路以秦州、凤翔府为中心，山川险阻，宜牧马。王韶经略熙河，开边二千余里，设置熙河路，秦凤路成为宋军西进基地。宋夏在好水川、定川寨等地的战争多发生于此，秦凤路也是茶马贸易的重要通道。</div>
