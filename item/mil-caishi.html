      <h1>采石之战</h1>
      <p class="m-sub">南宋 · 战役 · 1161 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">战役</span><span class="tag">金</span><span class="tag">南宋</span><span class="tag">水战</span></div>
      
      <div class="m-detail">1161 年，金主完颜亮率大军渡淮南侵，宋军溃退，长江防线告急。虞允文以中书舍人犒师采石，临危统率残军，利用水军与车船优势阻击金军渡江，金军大败。不久完颜亮在扬州被部将所杀，金军北撤，南宋转危为安。</div>
