    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">诗</span><span class="tag">南宋</span><span class="tag">诚斋体</span><span class="tag">杨万里</span></div>
      <div class="m-text"><h3>正文</h3><div class="m-text-body">泉眼无声惜细流，树阴照水爱晴柔。
小荷才露尖尖角，早有蜻蜓立上头。</div></div>
      <div class="m-detail">“泉眼无声惜细流，树阴照水爱晴柔。小荷才露尖尖角，早有蜻蜓立上头。”全诗从小处着眼，以拟人化手法写泉、树、荷、蜓，语言浅近而意趣盎然。杨万里主张“活法”，善于从日常景物中捕捉瞬间美感，形成独具一格的“诚斋体”。</div>
