      <div class="m-detail">成都府路沃野千里，都江堰灌溉系统保障农业；蜀锦、蜀纸、蜀刻与茶业闻名。北宋在此设成都府路转运使，交子最早出现于成都。南宋时四川是抗蒙前线，成都府路屡遭战火，但仍为西南政治经济中心。</div>
