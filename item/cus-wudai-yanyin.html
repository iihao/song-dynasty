      <h1>五代宴饮与乐舞</h1>
      <p class="m-sub">五代 · 宴饮</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">五代</span><span class="tag">五代</span><span class="tag">城市</span><span class="tag">宴饮</span><span class="tag">乐舞</span></div>
      
      <div class="m-detail">五代虽战乱频仍，宫廷与节度使仍大兴宴饮，蓄养歌儿舞女，表演曲子词、队舞、参军戏与百戏。南唐、后蜀尤其奢靡，花间词多产生于宴席之间。宋代瓦舍勾栏、酒楼茶肆的娱乐文化，正是在五代宴饮传统上发展而来。</div>
