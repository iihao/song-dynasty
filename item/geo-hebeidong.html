      <h1>河北东路</h1>
      <p class="m-sub">北宋 · 路制</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">边防</span><span class="tag">北宋</span><span class="tag">地理</span><span class="tag">路制</span></div>
      
      <div class="m-detail">河北东路以大名府、河间府为中心，地势平坦，无险可守，宋初开凿塘泊、种植水田以限辽骑。澶渊之盟后，河北东路成为宋辽使节往来与榷场贸易的通道；靖康以后又成为金军南下与义军抗金的主战场。</div>
