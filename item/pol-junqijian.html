      <p class="eyebrow">政治制度 · 官制</p>
      <h1>军器监与将作监</h1>
      <p class="m-sub">两宋 · 官制</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">官制</span><span class="tag">官营手工业</span><span class="tag">兵器</span><span class="tag">营缮</span></div>
      
      <div class="m-detail">军器监统辖弓弩院、南北作坊等，负责兵器、甲胄、旗帜的制造与验收；将作监掌宫室、城郭、桥梁、舟车营缮。两监下辖众多工匠与作院，实行“物勒工名”的责任制；南宋因战事需要，军器监与地方作院并重，但腐败与质量参差屡见。</div>
