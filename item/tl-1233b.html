      <h1>端平更化</h1>
      <p class="m-sub">南宋 · 事件 · 1233 年</p>

    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">事件</span><span class="tag">南宋</span><span class="tag">理宗</span><span class="tag">更化</span></div>
      
      <div class="m-detail">史弥远专权二十余年，理宗亲政后力图革新，罢黜史党，召还道学名臣，平反济王赵竑之狱，整顿吏治与财政。但更化因财政困窘、宋蒙战争爆发而成效有限。端平更化是南宋末年最后一次较大规模的政治改良尝试。</div>
