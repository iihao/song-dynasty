      <h1>军巡铺与城市消防</h1>
      <p class="m-sub">两宋 · 城市</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">治安</span><span class="tag">两宋</span><span class="tag">城市</span><span class="tag">消防</span></div>
      
      <div class="m-detail">汴京、临安街巷每三百步设军巡铺，配铺兵五人，夜间巡警；高处建望火楼，屯驻消防兵，备水桶、麻搭、斧锯等器具。一旦火起，铺兵鸣锣报警、奔赴扑救，并按地段责任追究。宋代城市木构建筑密集，消防制度因此高度发达，是城市管理的重要进步。</div>
