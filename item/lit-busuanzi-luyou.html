      <h1>《卜算子·咏梅》</h1>
      <p class="m-sub">南宋 · 词 · 1165 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">陆游</span><span class="tag">梅花</span><span class="tag">咏物</span><span class="tag">只有香如故</span></div>
      <div class="m-text"><h3>正文</h3><div class="m-text-body">驿外断桥边，寂寞开无主。已是黄昏独自愁，更著风和雨。
无意苦争春，一任群芳妒。零落成泥碾作尘，只有香如故。</div></div>
      <div class="m-detail">“驿外断桥边，寂寞开无主”写梅之处境；“已是黄昏独自愁，更著风和雨”写受摧折；下片“无意苦争春，一任群芳妒”明志，结句“零落成泥碾作尘，只有香如故”把气节写到不可摧毁。</div>
