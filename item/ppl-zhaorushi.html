      <h1>赵汝适</h1>
      <p class="m-sub">南宋 · 名臣 · 生卒 1170—1231</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag grp">名臣</span><span class="tag">海外贸易</span><span class="tag">南宋</span><span class="tag">地理</span><span class="tag">诸蕃志</span></div>
      
      <div class="m-detail">赵汝适字伯可，宋太宗八世孙。嘉定至宝庆年间任福建路市舶提举，兼知泉州，接触大量海商与蕃客。他广询海外诸国方位、物产、风俗与航路，成《诸蕃志》二卷，记五十余国，是研究宋代海上丝绸之路的重要文献。</div>
