      <div class="m-detail">汴京、临安的茶肆多临街开设，挂招牌、设雅座，供应点茶、散茶、花果茶与茶点；有的茶肆兼营说书、弈棋、听曲，成为市民社交空间。茶肆还承担行业聚会、雇佣中介与消息传递的功能，是宋代城市公共生活的重要场所。</div>
