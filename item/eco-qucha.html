      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">财政</span><span class="tag">专卖</span><span class="tag">茶</span><span class="tag">两宋</span></div>
      
      <div class="m-detail">宋初设榷茶场，园户所产茶叶除留少量自用外，全部卖给官府，再由官府批发给商人；商人凭茶引到指定地点提货。榷茶收入是宋朝财政的重要来源，也是茶马贸易的基础。园户因低价征购、私茶禁令而困苦，私贩屡禁不止。</div>
