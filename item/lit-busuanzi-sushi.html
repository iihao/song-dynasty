      <h1>《卜算子·缺月挂疏桐》</h1>
      <p class="m-sub">北宋 · 词 · 1083 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">苏轼</span><span class="tag">黄州</span><span class="tag">孤鸿</span><span class="tag">寂寞沙洲冷</span></div>
      <div class="m-text"><h3>正文</h3><div class="m-text-body">缺月挂疏桐，漏断人初静。
时见幽人独往来，缥缈孤鸿影。
惊起却回头，有恨无人省。
拣尽寒枝不肯栖，寂寞沙洲冷。</div></div>
      <div class="m-detail">“缺月挂疏桐，漏断人初静”营造清冷夜色；“拣尽寒枝不肯栖，寂寞沙洲冷”以孤鸿不肯栖枝喻不肯苟合。黄庭坚评此词“语意高妙，似非吃烟火食人语”。</div>
