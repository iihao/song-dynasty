      <p class="m-sub">西夏 · 都城 · 1038 年</p>

      <div class="m-tags"><span class="tag era">西夏</span><span class="tag">都城</span><span class="tag">银川</span><span class="tag">王陵</span></div>
      
      <div class="m-detail">兴庆府本为灵州怀远镇，李德明迁居筑城，1038 年元昊称帝后升为都城。城内营宫殿、置百官，西郊贺兰山下有西夏王陵。1227 年蒙古灭夏，城郭毁于兵火。</div>
