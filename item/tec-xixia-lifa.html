      <div class="m-detail">西夏历书以汉历为骨架，兼记党项语月名与吉凶宜忌，多为写本、刻本残页。历书的颁行说明西夏已具备观测、推算与雕印的官方能力，也反映其“仿汉制而立国”的技术路径。</div>
