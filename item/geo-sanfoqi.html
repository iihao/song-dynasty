      <h1>三佛齐</h1>
      <p class="m-sub">两宋 · 邦交</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">南海</span><span class="tag">贸易</span><span class="tag">两宋</span><span class="tag">邦交</span></div>
      
      <div class="m-detail">三佛齐位于今苏门答腊岛，扼守南海与印度洋交通要道，商船云集。宋代三佛齐多次遣使朝贡，宋在广州、泉州设驿接待；其地盛产香药、胡椒、象牙，转贩大食、印度货物。三佛齐的兴衰直接影响宋代海外贸易的畅通。</div>
