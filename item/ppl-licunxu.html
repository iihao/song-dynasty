    <div class="modal-body">
      <div class="m-tags"><span class="tag era">五代</span><span class="tag grp">帝王</span><span class="tag">后唐</span><span class="tag">河东</span><span class="tag">伶人</span></div>
      
      <div class="m-detail">李存勖善骑射，承父业据河东，与后梁夹河苦战十余年，终灭梁。后唐版图为五代最广者，然他宠信伶人、疏忌功臣，926 年兴教门之变中中流矢而死。</div>
