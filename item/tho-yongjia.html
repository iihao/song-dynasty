      <h1>永嘉学派</h1>
      <p class="m-sub">南宋 · 学派</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">南宋</span><span class="tag">永嘉</span><span class="tag">事功</span><span class="tag">制度</span></div>
      
      <div class="m-detail">永嘉学派由周行己开其端，薛季宣、陈傅良讲求田赋、兵制、水利等经世之学，叶适集其大成，主张“以利和义”，反对空谈心性，提出“道在器中”。其学与朱熹理学形成张力，是南宋浙东事功思潮的中坚。</div>
