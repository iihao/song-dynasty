      <h1>勃极烈制</h1>
      <p class="m-sub">金 · 官制 · 1115 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">金</span><span class="tag">汉制</span><span class="tag">勃极烈</span><span class="tag">女真旧制</span></div>
      
      <div class="m-detail">勃极烈为女真语“官长”，谙班勃极烈（储嗣）、国论勃极烈等分掌军政，保留部落议事遗风。熙宗天眷年间改行三省六部，勃极烈制遂废，金朝完成由部族联盟向官僚国家的转型。</div>
