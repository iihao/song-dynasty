      <h1>北方忠义军</h1>
      <p class="m-sub">南宋 · 兵制 · 1127 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">抗金</span><span class="tag">南宋</span><span class="tag">义军</span><span class="tag">河北</span></div>
      
      <div class="m-detail">靖康以后，河北、河东、山东等地民众结寨自保，号“忠义军”“忠义社”，多则数万，少则数百，既抗金也与南宋官方时合时离。著名者有王彦八字军、五马山寨、红巾军等；南宋朝廷既倚其牵制金军，又惧其尾大不掉，往往招抚、分割乃至解散。</div>
