      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">江南</span><span class="tag">农业</span><span class="tag">水利</span><span class="tag">两宋</span></div>
      
      <div class="m-detail">福建莆田木兰陂始建于北宋治平年间，历经三次营建，兼具蓄水、灌溉、排洪与通航功能；浙江鄞县它山堰为唐代始建、宋代续修，分导鄞江与奉化江；太湖地区则形成塘浦圩田体系。宋代还设都水监与地方河堤使，水利成为国家与地方共同经营的事业。</div>
