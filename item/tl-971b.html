      <p class="m-sub">北宋 · 事件 · 971 年</p>

    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">海外贸易</span><span class="tag">北宋</span><span class="tag">事件</span><span class="tag">市舶</span></div>
      
      <div class="m-detail">市舶司设提举官，掌蕃货、海舶、征榷、贸易之事。广州之后，杭州、明州、泉州、密州等地相继设司。市舶收入成为宋朝财政的重要来源，南宋时更盛。市舶司的设立标志着宋代海外贸易管理的制度化。</div>
