      <h1>《卜算子·不是爱风尘》</h1>
      <p class="m-sub">南宋 · 词 · 1180 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">严蕊</span><span class="tag">营妓</span><span class="tag">自辩</span><span class="tag">花开花落自有时</span></div>
      <div class="m-text"><h3>正文</h3><div class="m-text-body">不是爱风尘，似被前缘误。
花落花开自有时，总赖东君主。
去也终须去，住也如何住。
若得山花插满头，莫问奴归处。</div></div>
      <div class="m-detail">“不是爱风尘，似被前缘误”写身不由己；“花落花开自有时，总赖东君主”以花喻命运；下片“去也终须去，住也如何住”写去留两难，结句“若得山花插满头，莫问奴归处”写对自由的向往。</div>
