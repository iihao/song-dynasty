      <h1>巡检与地方治安</h1>
      <p class="m-sub">两宋 · 治安</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">基层</span><span class="tag">治安</span><span class="tag">两宋</span><span class="tag">巡检</span></div>
      
      <div class="m-detail">巡检多设于乡村、江河、边境与盐茶产区，职责包括捕盗贼、禁私盐私茶、检查商旅、维护驿路。巡检下辖寨、铺、堡，兵力从数十到数百不等。南宋以后，巡检与尉司、保甲相互配合，构成地方治安网络，但吏治腐败时也常扰民。</div>
