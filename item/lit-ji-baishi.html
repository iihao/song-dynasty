      <h1>《白石道人歌曲》</h1>
      <p class="m-sub">两宋 · 词集 · 1195 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">两宋</span><span class="tag">词集</span><span class="tag">格律</span><span class="tag">姜夔</span><span class="tag">旁谱</span></div>
      
      <div class="m-detail">姜夔自度曲甚多，音律精严，词风清空骚雅。《扬州慢》《暗香》《疏影》等皆为自度曲。所附俗字旁谱经后世学者解读，成为研究宋代音乐的关键材料。</div>
