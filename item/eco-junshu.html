      <h1>均输法</h1>
      <p class="m-sub">北宋 · 新法 · 1069 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">财政</span><span class="tag">漕运</span><span class="tag">北宋</span><span class="tag">新法</span></div>
      
      <div class="m-detail">熙宁二年在东南六路推行，扩大发运使职权，使其统筹上供物资的采购、运输与储备，避免富商囤积居奇和官府重复采购。均输法旨在提高财政效率、降低运输成本，但实施中因信息不畅、官吏舞弊，效果有限，后渐废。</div>
