      <div class="m-detail">平阳府经济文化发达，盛产纸张与枣木，金代设经籍所，民间书坊刻印经史、医书、类书、词曲与佛经。平水版以校勘精、纸墨佳著称，今存《刘知远诸宫调》《四美图》等。金代印刷上承北宋、下启元明，是北方出版史的重要环节。</div>
