      <h1>周去非</h1>
      <p class="m-sub">南宋 · 名臣 · 生卒 1135—1189</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag grp">名臣</span><span class="tag">南宋</span><span class="tag">地理</span><span class="tag">岭南</span><span class="tag">岭外代答</span></div>
      
      <div class="m-detail">周去非字直夫，温州永嘉人，隆兴元年进士。他任静江府通判时，遍访当地山川、物产、风俗与海外交通，成《岭外代答》十卷，分地理、风土、物产、外国等门，记大食、三佛齐、阇婆等地，是宋代海外地理的重要著作。</div>
