      <h1>吴越水利与海贸</h1>
      <p class="m-sub">五代 · 水利 · 910 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">五代</span><span class="tag">吴越</span><span class="tag">捍海塘</span><span class="tag">明州</span><span class="tag">海外贸易</span></div>
      
      <div class="m-detail">钱镠于 910 年筑钱塘江捍海石塘，又置撩湖军浚治西湖，太湖流域大兴圩田。吴越同时经营明州、杭州港口，与日本、高丽、大食商人往来，岁入颇丰。宋人“上有天堂，下有苏杭”之语，基础正是吴越打下的。</div>
