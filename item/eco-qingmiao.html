      <h1>青苗法</h1>
      <p class="m-sub">北宋 · 新法 · 1069 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">借贷</span><span class="tag">北宋</span><span class="tag">农业</span><span class="tag">新法</span></div>
      
      <div class="m-detail">熙宁二年颁行，以常平、广惠仓钱谷为本，春贷秋还，半年取息二分，意在抑制高利贷、增加财政收入。实施中因强制摊派、抑配与利息负担，遭到韩琦、司马光等强烈反对；元祐更化时废罢，后虽偶有恢复，终未成定制。</div>
