      <h1>王旦</h1>
      <p class="m-sub">北宋 · 名臣 · 生卒 957—1017</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag grp">名臣</span><span class="tag">宰相</span><span class="tag">北宋</span><span class="tag">真宗</span><span class="tag">名臣</span></div>
      
      <div class="m-detail">王旦字子明，大名莘人，太平兴国五年进士。真宗朝拜相十余年，处事谨慎，常荐引人才而不使知。澶渊之盟后，他支持真宗封禅、营造宫观，虽耗费巨大，但维持了政局稳定。卒谥文正，与寇准并称真宗朝名相。</div>
