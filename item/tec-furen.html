      <h1>陈自明与《妇人大全良方》</h1>
      <p class="m-sub">南宋 · 医学</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">医学</span><span class="tag">南宋</span><span class="tag">妇科</span><span class="tag">陈自明</span></div>
      
      <div class="m-detail">陈自明任建康府明道书院医谕，博采《千金》《外台》及家传验方，编成《妇人大全良方》二十四卷，分调经、众疾、求嗣、胎教、妊娠、坐月、产难、产后等门。书中重视气血与冲任，记载大量方剂与助产技术，后世妇科多宗之。</div>
