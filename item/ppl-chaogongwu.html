      <h1>晁公武</h1>
      <p class="m-sub">南宋 · 文豪 · 生卒 1105—1180</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag grp">文豪</span><span class="tag">南宋</span><span class="tag">藏书</span><span class="tag">目录学</span><span class="tag">读书志</span></div>
      
      <div class="m-detail">晁公武字子止，澶州清丰人，靖康之乱后入蜀，官至敷文阁直学士。他得井度赠书，加上家藏，校雠考订，编成《郡斋读书志》二十卷，分经、史、子、集四部，每书撰提要，考作者、内容、版本与得失。该书与陈振孙《直斋书录解题》并称宋代私家目录双璧。</div>
