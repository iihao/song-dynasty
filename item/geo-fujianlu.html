      <div class="m-detail">福建路多山少田，民众向海谋生，泉州成为海上丝绸之路的重要枢纽，市舶收入丰厚；建阳麻沙、崇化书坊刻书业兴盛，号称“建本”。福建还以茶、盐、荔枝、造船著称，科举中第者众多，形成“海滨邹鲁”之风。</div>
