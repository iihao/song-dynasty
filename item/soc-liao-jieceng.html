      <p class="m-sub">辽 · 阶层 · 916 年</p>

    <div class="modal-body">
      <div class="m-tags"><span class="tag era">辽</span><span class="tag">宫分人</span><span class="tag">头下户</span><span class="tag">著帐户</span></div>
      
      <div class="m-detail">宫分人（斡鲁朵户）隶属皇帝与后族宫帐，供役而不入州县；头下户是贵族俘掠人口所建头下军州的属民；著帐户为犯罪没入官府的奴婢。汉人、渤海人多入州县编户，依汉法纳税。蕃汉异法是辽制的一体两面。</div>
