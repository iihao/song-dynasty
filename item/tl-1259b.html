      <h1>鄂州之战与贾似道议和</h1>
      <p class="m-sub">南宋 · 事件 · 1259 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">南宋</span><span class="tag">事件</span><span class="tag">南宋</span><span class="tag">贾似道</span><span class="tag">鄂州</span></div>
      
      <div class="m-detail">1259 年，忽必烈率军渡江围攻鄂州，南宋朝野震动。贾似道督师救援，暗中遣使求和，许以岁币；恰逢蒙哥死于钓鱼城，忽必烈急于北归争位，遂撤军。贾似道隐瞒议和，宣称大捷，由此专权。此事为宋蒙关系与南宋末年政治埋下隐患。</div>
