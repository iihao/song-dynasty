      <h1>《浣溪沙·漠漠轻寒上小楼》</h1>
      <p class="m-sub">北宋 · 词 · 1090 年</p>
    </div>
    <div class="modal-body">
      <div class="m-tags"><span class="tag era">北宋</span><span class="tag">婉约</span><span class="tag">秦观</span><span class="tag">春愁</span><span class="tag">自在飞花轻似梦</span></div>
      <div class="m-text"><h3>正文</h3><div class="m-text-body">漠漠轻寒上小楼，晓阴无赖似穷秋。淡烟流水画屏幽。
自在飞花轻似梦，无边丝雨细如愁。宝帘闲挂小银钩。</div></div>
      <div class="m-detail">全词写晓阴、画屏、宝帘，境极清冷；“自在飞花轻似梦，无边丝雨细如愁”把飞花比作梦、丝雨比作愁，本体与喻体都是无形之物，却因此更见空灵。梁启超称其为“奇语”。</div>
